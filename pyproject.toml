[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jahbadh"
version = "0.1.0"
description = "AI match desk that explains football and proves every claim."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "matplotlib>=3.9",
    "agent-framework-core>=1.22,<2",
    "agent-framework-openai>=1.17,<2",
    "openai>=3.33,<4",
    "azure-ai-translation-text>=2.0,<3",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real Azure services, opt-in with JAHBADH_LIVE=1"]
