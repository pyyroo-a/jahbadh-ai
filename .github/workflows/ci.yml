name: CI

# Runs the Python and web tests on every push. The Deploy workflow calls this first too.
# No secrets are used: the tests never call Azure, and the live tests stay skipped without JAHBADH_LIVE.

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --prefix web
      - name: Test
        run: npm --prefix web run test
      - name: Build
        run: npm --prefix web run build
      - name: Lint
        run: npm --prefix web run lint
