# The Azure Developer CLI reads this. azd provision makes the Azure resources from infra/, and azd deploy
# builds the image in the registry and ships it to the container app. Azure for Students can't build in the
# registry, so there the Deploy workflow on GitHub builds and ships it instead (docs/deploy.md step 7).
name: jahbadh
services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
infra:
  provider: bicep
  path: infra
